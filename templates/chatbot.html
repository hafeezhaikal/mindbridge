{% extends "base.html" %}
{% set step_index = 4 %}
{% block title %}AI Companion{% endblock %}

{% block head %}
<style>
  .chat-shell {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
    min-height: 0;
    height: calc(100vh - 140px);
  }
  .chat-header {
    padding: 0.85rem 1.2rem;
    background: var(--navy-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .bot-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    flex-shrink: 0;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.3s ease both;
  }
  .msg.user {
    flex-direction: row-reverse;
  }
  .msg-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 13px;
    line-height: 1.55;
    position: relative;
    word-break: break-word;
  }
  .msg.bot .msg-bubble {
    background: var(--navy-card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--white);
  }
  .msg.user .msg-bubble {
    background: rgba(46,196,182,0.18);
    border: 1px solid rgba(46,196,182,0.3);
    border-bottom-right-radius: 4px;
    color: var(--white);
  }
  .msg-time {
    font-size: 9px;
    color: var(--muted);
    margin-top: 4px;
    text-align: right;
  }
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-left: 46px;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  @keyframes typingBounce {
    0%,100% { transform: translateY(0); opacity: 0.5; }
    50%      { transform: translateY(-6px); opacity: 1; }
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--navy);
  }
  #chatInput {
    flex: 1;
    background: var(--navy-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--white);
    padding: 10px 14px;
    font-family: var(--font-body);
    font-size: 13px;
    outline: none;
    resize: none;
    max-height: 80px;
  }
  #chatInput:focus {
    border-color: var(--teal);
  }
  #sendBtn {
    padding: 10px 16px;
    background: var(--teal);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--navy);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.18s;
  }
  #sendBtn:hover {
    background: var(--teal-dim);
  }
  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0.6rem 1rem;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--navy);
  }
  .chip {
    padding: 8px 14px;
    min-height: 36px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
  }
  .chip:active {
    transform: scale(0.96);
    background: rgba(46,196,182,0.1);
  }
  .chip:hover {
    border-color: var(--teal);
    color: var(--teal);
  }
  .score-pill {
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
  }
  .game-cta {
    background: rgba(244,201,75,0.1);
    border: 1px solid rgba(244,201,75,0.3);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-top: 4px;
  }
  .game-cta p {
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .game-cta a {
    display: inline-block;
    padding: 8px 18px;
    background: var(--gold);
    border-radius: var(--radius-sm);
    color: var(--navy);
    font-weight: 600;
    font-size: 12px;
    text-decoration: none;
  }
  .game-cta a:hover {
    background: var(--gold-dim);
  }
  @media (max-width: 600px) {
    .msg-bubble {
      max-width: 85%;
      font-size: 12px;
    }
    .chat-messages {
      padding: 0.75rem;
    }
    .chat-header {
      padding: 0.6rem 1rem;
    }
    .chip {
      padding: 6px 12px;
      font-size: 11px;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="chat-shell">
  <div class="chat-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="bot-avatar">AI</div>
      <div>
        <div style="font-size:13px; font-weight:600;">Wellness Companion</div>
        <div style="font-size:10px; color:var(--sage);">Here for you 💚</div>
      </div>
    </div>
    <div>
      <span class="score-pill badge" id="headerBadge">--</span>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="quick-chips" id="quickChips">
    <!-- Buttons will be populated by JavaScript -->
  </div>

  <div class="chat-input-row">
    <textarea id="chatInput" rows="1" placeholder="Type your message..." onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // ---------- Load analysis data ----------
  const rawData = '{{ data | safe }}';
  let analysis = {};
  try {
    analysis = JSON.parse(rawData || sessionStorage.getItem('analysisResult') || '{}');
  } catch(e) { console.warn(e); }
  const wellbeingScore = analysis.score || 0.5;
  const statusInfo = analysis.chatbot?.status || {};
  const gameRec = analysis.game || {};
  const userIntent = analysis.nlp?.intent || null;

  // ---------- Chat history persistence ----------
  let chatHistory = [];
  const STORAGE_KEY = 'mindbridge_chat_history';
  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      chatHistory = JSON.parse(saved);
    } catch(e) { console.warn(e); }
  }

  // ---------- DOM elements ----------
  const messagesContainer = document.getElementById('chatMessages');
  const headerBadge = document.getElementById('headerBadge');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const quickChipsContainer = document.getElementById('quickChips');

  // ---------- Helper functions ----------
  function formatTime() {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // Append a normal text message
  function appendMessage(role, text, saveToHistory = true) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${role}`;
    const timeStr = formatTime();
    if (role === 'bot') {
      msgDiv.innerHTML = `
        <div class="bot-avatar" style="width:28px; height:28px; font-size:11px;">AI</div>
        <div style="flex:1">
          <div class="msg-bubble">${escapeHtml(text)}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      `;
    } else {
      msgDiv.innerHTML = `
        <div style="flex:1; text-align:right;">
          <div class="msg-bubble" style="display:inline-block; text-align:left;">${escapeHtml(text)}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      `;
    }
    messagesContainer.appendChild(msgDiv);
    scrollToBottom();

    if (saveToHistory) {
      chatHistory.push({ role, text, time: timeStr });
      if (chatHistory.length > 100) chatHistory.shift();
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
    }
  }

  // Append a game card (button + description)
  function appendGameCard(game, replyText) {
    const timeStr = formatTime();
    const gameCardHtml = `
      <div class="msg bot">
        <div class="bot-avatar" style="width:28px; height:28px; font-size:11px;">AI</div>
        <div style="flex:1">
          <div class="msg-bubble">
            <p style="margin-bottom:6px;">${escapeHtml(replyText)}</p>
            <div class="game-cta">
              <p><strong>${escapeHtml(game.name)}</strong> – ${escapeHtml(game.label || '')}</p>
              <a href="/game/${escapeHtml(game.type)}">Start Activity →</a>
            </div>
          </div>
          <div class="msg-time">${timeStr}</div>
        </div>
      </div>
    `;
    messagesContainer.insertAdjacentHTML('beforeend', gameCardHtml);
    scrollToBottom();
    // Save only the text part to history (game card is ephemeral)
    chatHistory.push({ role: 'bot', text: replyText, time: timeStr });
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
  }

  function restoreHistory() {
    if (!chatHistory.length) return;
    for (let msg of chatHistory) {
      appendMessage(msg.role, msg.text, false);
    }
  }

  // Typing indicator
  let isTypingVisible = false;
  function showTyping() {
    if (isTypingVisible) return;
    const typingDiv = document.createElement('div');
    typingDiv.id = 'typingIndicator';
    typingDiv.className = 'typing-indicator';
    typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    messagesContainer.appendChild(typingDiv);
    scrollToBottom();
    isTypingVisible = true;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
    isTypingVisible = false;
  }

  // Send message to backend
  let isSending = false;
  function sendToBackend(userMessage) {
    if (isSending) return;
    isSending = true;
    showTyping();
    fetch('/api/chatbot-reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userMessage,
        score: wellbeingScore,
        intent: userIntent
      })
    })
    .then(res => res.json())
    .then(data => {
      hideTyping();
      if (data.game) {
        // Show game card with the reply text and game object
        appendGameCard(data.game, data.reply);
      } else {
        appendMessage('bot', data.reply);
      }
      isSending = false;
    })
    .catch(err => {
      console.error(err);
      hideTyping();
      appendMessage('bot', "I'm having trouble connecting. Please try again in a moment. Remember, you're not alone – support is available. 💙");
      isSending = false;
    });
  }

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    appendMessage('user', text);
    chatInput.value = '';
    sendToBackend(text);
  }

  function quickSend(text) {
    chatInput.value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // Build quick chips
  const quickChipsData = [
    { text: "📊 My score", msg: "Tell me my score" },
    { text: "🎮 Game suggestion", msg: "What game should I play?" },
    { text: "🧘 Manage stress", msg: "How can I manage stress?" },
    { text: "🆘 Need help", msg: "I need help" },
    { text: "🤖 How it works", msg: "Explain how the AI works" },
    { text: "😊 Feeling better", msg: "I feel better now" },
    { text: "😴 Sleep issues", msg: "I can't sleep" },
    { text: "💔 Loneliness", msg: "Feeling lonely" },
  ];

  function buildQuickChips() {
    quickChipsContainer.innerHTML = '';
    quickChipsData.forEach(chip => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = chip.text;
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        quickSend(chip.msg);
      });
      quickChipsContainer.appendChild(btn);
    });
  }

  // Initial game card (from analysis data)
  let gameCardShown = false;
  function maybeShowGameCard() {
    if (!gameRec.name || gameCardShown) return;
    gameCardShown = true;
    const timeStr = formatTime();
    const gameCardHtml = `
      <div class="msg bot">
        <div class="bot-avatar" style="width:28px; height:28px; font-size:11px;">AI</div>
        <div style="flex:1">
          <div class="msg-bubble">
            <p style="margin-bottom:6px;">Based on your check-in, I recommend:</p>
            <div class="game-cta">
              <p><strong>${escapeHtml(gameRec.name)}</strong> – ${escapeHtml(gameRec.label || '')}</p>
              <a href="/game/${escapeHtml(gameRec.type)}">Start Activity →</a>
            </div>
          </div>
          <div class="msg-time">${timeStr}</div>
        </div>
      </div>
    `;
    messagesContainer.insertAdjacentHTML('beforeend', gameCardHtml);
    scrollToBottom();
    // Save a placeholder text to history
    chatHistory.push({ role: 'bot', text: `Recommended activity: ${gameRec.name}`, time: timeStr });
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
  }

  // Initial welcome conversation
  function startConversation() {
    const welcomeMessages = [
      "Hi there! I'm your digital wellness companion. 💙 I'm here to listen and support you.",
      `Your current wellbeing score is ${Math.round(wellbeingScore*100)}% – that's ${statusInfo.label || 'a normal range'}. It's okay to feel however you feel.`,
    ];
    if (analysis.chatbot?.intro) welcomeMessages.push(analysis.chatbot.intro);
    if (analysis.chatbot?.coping) welcomeMessages.push(analysis.chatbot.coping);
    
    let delay = 0;
    for (let msg of welcomeMessages) {
      delay += 800;
      setTimeout(() => {
        appendMessage('bot', msg);
      }, delay);
    }
    setTimeout(() => {
      maybeShowGameCard();
    }, delay + 1000);
  }

  // Initialize UI
  window.addEventListener('DOMContentLoaded', () => {
    if (statusInfo.label) {
      headerBadge.textContent = `${Math.round(wellbeingScore*100)}% – ${statusInfo.label}`;
      headerBadge.className = `score-pill badge badge-${statusInfo.level || 'info'}`;
    }
    buildQuickChips();
    restoreHistory();
    if (chatHistory.length === 0) {
      startConversation();
    } else {
      maybeShowGameCard();
    }
    sendBtn.onclick = sendMessage;
    chatInput.onkeydown = handleKey;
  });
</script>
{% endblock %}
